version: 2

builds:
  - id: dbridge-darwin
    main: ./cmd/dbridge
    binary: dbridge
    ldflags: &ldflags
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

  - id: dbridge-linux
    main: ./cmd/dbridge
    binary: dbridge
    ldflags: *ldflags
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz

brews:
  - repository:
      owner: thalesfp
      name: homebrew-dbridge
    homepage: https://github.com/thalesfp/dbridge
    description: Multi-database CLI and MCP server for AI agents
    license: MIT
