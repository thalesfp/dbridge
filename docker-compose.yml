services:
  dbridge-primary:
    image: postgres:16-alpine
    container_name: dbridge-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5440:5432"
    volumes:
      - ./test/fixtures/sample_data.sql:/docker-entrypoint-initdb.d/01_sample_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - dbridge-test

  dbridge-trust:
    image: postgres:16-alpine
    container_name: dbridge-trust
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
    ports:
      - "5441:5432"
    volumes:
      - ./test/fixtures/sample_data.sql:/docker-entrypoint-initdb.d/01_sample_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - dbridge-test

  dbridge-ssl:
    image: postgres:16-alpine
    container_name: dbridge-ssl
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5442:5432"
    volumes:
      - ./test/fixtures/sample_data.sql:/docker-entrypoint-initdb.d/01_sample_data.sql:ro
      - ./test/docker/ssl/certs/server.crt:/tmp/certs/server.crt:ro
      - ./test/docker/ssl/certs/server.key:/tmp/certs/server.key:ro
      - ./test/docker/ssl/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    entrypoint:
      - sh
      - -c
      - |
        cp /tmp/certs/server.crt /tmp/server.crt
        cp /tmp/certs/server.key /tmp/server.key
        chown postgres:postgres /tmp/server.crt /tmp/server.key
        chmod 600 /tmp/server.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/tmp/server.crt \
          -c ssl_key_file=/tmp/server.key \
          -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - dbridge-test

  dbridge-rich:
    image: postgres:16-alpine
    container_name: dbridge-rich
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5443:5432"
    volumes:
      - ./test/fixtures/rich_schema.sql:/docker-entrypoint-initdb.d/01_rich_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - dbridge-test

  dbridge-mysql-primary:
    image: mysql:8.0
    container_name: dbridge-mysql-primary
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_USER: dbridge
      MYSQL_PASSWORD: dbridge
      MYSQL_DATABASE: dbridge_test
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3340:3306"
    volumes:
      - ./test/docker/mysql/auth.cnf:/etc/mysql/conf.d/auth.cnf:ro
      - ./test/fixtures/mysql_sample_data.sql:/docker-entrypoint-initdb.d/01_sample_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - dbridge-test

  dbridge-mongo:
    image: mongo:7
    container_name: dbridge-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: dbridge
      MONGO_INITDB_ROOT_PASSWORD: dbridge
      MONGO_INITDB_DATABASE: dbridge_test
    ports:
      - "27040:27017"
    volumes:
      - ./test/fixtures/mongo_sample_data.js:/docker-entrypoint-initdb.d/01_sample_data.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "-u", "dbridge", "-p", "dbridge", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - dbridge-test

  dbridge-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbridge-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "dbridge_Test1234"
      MSSQL_PID: "Developer"
    ports:
      - "1440:1433"
    volumes:
      - ./test/fixtures/mssql_sample_data.sql:/fixtures/mssql_sample_data.sql:ro
    # The mssql image has no auto-init dir, so start sqlservr, wait until it
    # accepts connections, then load the fixture. The fixture creates a sentinel
    # table last; the healthcheck gates on it so `up --wait` blocks until data is in.
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        pid=$$!
        for i in $$(seq 1 60); do
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null 2>&1 && break
          sleep 1
        done
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -d master -i /fixtures/mssql_sample_data.sql
        wait $$pid
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -d master -Q \"SELECT 1 FROM dbo._dbridge_ready WHERE ok = 1\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - dbridge-test

networks:
  dbridge-test:
    driver: bridge
